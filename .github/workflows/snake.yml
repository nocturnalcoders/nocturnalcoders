name: Contribution Snake

on:
  schedule:
    - cron: "0 18 * * *"   # setiap hari jam 02:00 waktu Singapura
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-night.svg?palette=github-dark&color_snake=#c69bff&color_dots=#161b3d,#2a2f6b,#4a4fa8,#8ab4ff,#e0e6ff&color_background=#0b1020

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}