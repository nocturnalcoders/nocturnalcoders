name: Profile Summary Cards

on:
  schedule:
    - cron: "0 18 * * *"   # setiap hari jam 02:00 waktu Singapura
  workflow_dispatch:        # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Kalau muncul error "Resource not accessible by integration",
          # buat Personal Access Token, simpan sebagai secret SUMMARY_GITHUB_TOKEN,
          # lalu ganti baris di bawah menjadi: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"   # ganti ke "master" kalau branch utama repo kamu master
          UTC_OFFSET: 8